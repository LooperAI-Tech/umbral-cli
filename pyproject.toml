[project]
name = "umbral-cli"
version = "0.1.0"
description = "Framework de desarrollo con comprensión sostenible"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "jinja2>=3.1.4",
    "anthropic>=0.40.0",
    "tenacity>=8.2.0",
]

[project.scripts]
umbral = "umbral.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umbral"]

[tool.hatch.build.targets.wheel.force-include]
"src/umbral/prompts" = "umbral/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
